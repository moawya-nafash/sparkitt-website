<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <title>Book Demo - Sparkitt</title>
    <meta name="description" content="Book a free demo to see how Sparkitt can help your business">
    <meta name="keyword" content="Sparkitt, demo, consultation, free trial">
    <meta name="author" content="moawya nafash">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="refresh" content="900">

    <!-- Link CSS files -->
    <link rel="stylesheet" href="../assets/css/header.css">
    <link rel="stylesheet" href="../assets/css/footer.css">
    <link rel="stylesheet" href="../assets/css/about.css">
    <link rel="stylesheet" href="../assets/css/booking-form.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">

</head>

<body>
    <!-- Include header -->
    <div id="header"></div>

    <div class="container">
        <div class="form-container">
            <h2>Book Your Free Demo</h2>
            <form id="bookingForm">

                <div class="form-field"><label>Name</label><input type="text" name="name" required></div>
                <div class="form-field"><label>Email</label><input type="email" name="email" required></div>
                <div class="form-field"><label>Phone</label><input type="tel" name="phone"></div>
                <div class="form-field"><label>Address</label><input type="text" name="address"></div>

                <div class="form-field">
                    <label id="statusLabel" style="color: #ff4500;">Date & Time (Loading...)</label>
                    <div class="appointment-section">
                        <div class="calendar-box"><input type="text" id="inline_cal" style="display:none"></div>
                        <div class="time-box">
                            <div id="dateDisplay" style="text-align:center; margin-bottom:15px; font-size:1.1em;">Select
                                Date</div>
                            <div class="time-grid">
                                <button type="button" class="time-btn" data-time="10:00 AM">10:00 AM</button>
                                <button type="button" class="time-btn" data-time="11:00 AM">11:00 AM</button>
                                <button type="button" class="time-btn" data-time="12:00 PM">12:00 PM</button>
                                <button type="button" class="time-btn" data-time="01:00 PM">01:00 PM</button>
                                <button type="button" class="time-btn" data-time="02:00 PM">02:00 PM</button>
                                <button type="button" class="time-btn" data-time="03:00 PM">03:00 PM</button>
                            </div>
                        </div>
                    </div>
                    <input type="hidden" name="meetingDate" id="hDate">
                    <input type="hidden" name="meetingTime" id="hTime">
                </div>

                <div class="form-field"><label>Notes</label><textarea name="notes" rows="3"></textarea></div>
                <button type="submit" id="submitBtn">Submit Booking</button>
                <div id="msg" style="text-align:center; margin-top:15px; padding:10px; border-radius:5px;"></div>
            </form>
        </div>
    </div>


    <!-- Footer -->
    <div id="footer"></div>

    <!-- Load Header and Footer -->
    <script src="../assets/js/header-footer.js"></script>
    <script src="../assets/js/responsive.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="../assets/js/booking-form.js"></script>
</body>

</html>
